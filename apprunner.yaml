version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - chmod +x scripts/apprunner-build.sh
    build:
      - bash scripts/apprunner-build.sh
run:
  command: python3 run.py
  network:
    port: 8080
  env:
    - name: DEBUG
      value: "false"
    - name: SEED_DEMO_DATA
      value: "true"
    - name: LIGHTWEIGHT_PREDICTIONS
      value: "true"
