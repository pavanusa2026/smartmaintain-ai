version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - chmod +x scripts/apprunner-build.sh
    build:
      - bash scripts/apprunner-build.sh
run:
  command: python3 run.py
  network:
    port: 8080
  env:
    - name: DEBUG
      value: "false"
    - name: SEED_DEMO_DATA
      value: "true"
    - name: LIGHTWEIGHT_PREDICTIONS
      value: "true"
    - name: JWT_SECRET
      value: "a8f3c2e91b047d6e5f0a9c3b8d7e4f1c6a2b9d0e8f7c4a1b6d3e9f2c5a8b1d4e7f0"
