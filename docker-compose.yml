services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USE_LOCAL_MODEL=true
      - AWS_REGION=us-east-1
      - DEBUG=true
      - SEED_DEMO_DATA=true
      - JWT_SECRET=dev-secret-change-in-production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    depends_on:
      app:
        condition: service_healthy
    environment:
      - API_URL=http://app:8080
    command: ["python", "machine_simulator.py", "--api-url", "http://app:8080", "--interval", "5", "--scenario", "normal"]
