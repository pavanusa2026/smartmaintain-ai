AWSTemplateFormatVersion: '2010-09-09'
Description: SmartMaintain AI DynamoDB Tables

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  MachinesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smartmaintain-machines-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: machineId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: productionLine
          AttributeType: S
      KeySchema:
        - AttributeName: machineId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: productionLine-index
          KeySchema:
            - AttributeName: productionLine
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smartmaintain-alerts-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WorkOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smartmaintain-work-orders-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: workOrderId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: workOrderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InspectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smartmaintain-inspections-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: inspectionId
          AttributeType: S
      KeySchema:
        - AttributeName: inspectionId
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smartmaintain-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  MachinesTableName:
    Value: !Ref MachinesTable
  AlertsTableName:
    Value: !Ref AlertsTable
  WorkOrdersTableName:
    Value: !Ref WorkOrdersTable
  InspectionsTableName:
    Value: !Ref InspectionsTable
  UsersTableName:
    Value: !Ref UsersTable
